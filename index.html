<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHM 106 Exam 2 – Word Problem Setups</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --good:#22c55e; --bad:#ef4444; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", Arial, sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
  header { padding:16px 20px; border-bottom:1px solid #334155; }
  h1 { margin:0; font-size:1.3rem; }
  .sub { color:var(--muted); font-size:.9rem; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; align-items:center; }
  button, select { font:inherit; padding:8px 12px; border-radius:8px; border:1px solid #475569; background:#334155; color:var(--text); cursor:pointer; }
  button.active { background:var(--accent); color:#0f172a; border-color:var(--accent); font-weight:600; }
  .card { background:var(--card); border-radius:12px; padding:18px; margin-bottom:14px; }
  .topic { color:var(--accent); font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; }
  .problem { font-size:1.02rem; margin:6px 0 0; }
  .eq { margin-top:8px; color:var(--muted); font-size:.92rem; }
  .step { color:var(--muted); font-size:.85rem; margin-bottom:4px; }
  .question { font-weight:600; margin-bottom:12px; }
  .options { display:grid; gap:8px; }
  .options button { text-align:left; background:#0f172a; }
  .options button.correct { border-color:var(--good); background:#14532d; }
  .options button.wrong { border-color:var(--bad); background:#7f1d1d; }
  .options button:disabled { cursor:default; }
  .why { margin-top:12px; padding:10px 12px; border-left:4px solid var(--accent); background:#0f172a; border-radius:6px; display:none; }
  .next { margin-top:12px; display:none; }
  .score { color:var(--muted); font-size:.9rem; margin-left:auto; }
  .flash { min-height:230px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; font-size:1.15rem; cursor:pointer; user-select:none; }
  .flash .side { color:var(--muted); font-size:.8rem; margin-bottom:10px; text-transform:uppercase; }
  .flash.back { border:2px solid var(--accent); }
  .row { display:flex; gap:8px; justify-content:space-between; align-items:center; flex-wrap:wrap; }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <h1>⚗️ CHM 106 Exam 2 – Word Problem Setups</h1>
  <div class="sub">Figure out which numbers to use, which mole ratio, and how to set each problem up.</div>
</header>

<main>
  <div class="controls">
    <button id="modeQuiz" class="active">Multiple choice</button>
    <button id="modeFlash">Flashcards</button>
  </div>

  <div id="quizControls" class="controls">
    <select id="topicSel"></select>
    <button id="numTest" class="active">Practice test numbers</button>
    <button id="numRand">Random numbers</button>
    <span class="score" id="score">Score: 0 / 0</span>
  </div>

  <section id="quiz"></section>
  <section id="flash" class="hidden"></section>
</main>

<script>
// ---------- helpers ----------
const NA = 6.022e23;
const MM = { Al: 26.9815, H2SO4: 97.967, P: 341.818, H2: 2.016 };
const RXN = '2 Al(s) + 3 H<sub>2</sub>SO<sub>4</sub>(aq) → Al<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub>(aq) + 3 H<sub>2</sub>(g)';
const MMLINE = 'Molar masses: Al 26.9815, H<sub>2</sub>SO<sub>4</sub> 97.967, Al<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub> 341.818, H<sub>2</sub> 2.016 g/mol';
const AV = '6.022×10<sup>23</sup>';

const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function sci(x, sf = 3) { const [m, e] = x.toExponential(sf - 1).split('e'); return `${m} × 10<sup>${parseInt(e)}</sup>`; }
const n4 = x => x.toFixed(4);

// make a multiple-choice step (removes duplicate wrong answers)
function mc(q, correct, wrongs, why) {
  const seen = new Set([correct]);
  const opts = [{ t: correct, ok: true }];
  for (const w of wrongs) if (!seen.has(w)) { seen.add(w); opts.push({ t: w, ok: false }); }
  return { q, options: shuffle(opts), why };
}

const COMPOUNDS = [
  { f: 'AgClO<sub>3</sub>', name: 'silver chlorate', mm: 191.319 },
  { f: 'NaCl', name: 'sodium chloride', mm: 58.443 },
  { f: 'KNO<sub>3</sub>', name: 'potassium nitrate', mm: 101.103 },
  { f: 'CuSO<sub>4</sub>', name: 'copper(II) sulfate', mm: 159.609 },
  { f: 'KCl', name: 'potassium chloride', mm: 74.551 }
];

// ---------- problem templates ----------
// #1: molarity + volume -> grams
function pMolarityToMass(test) {
  const c = test ? COMPOUNDS[0] : pick(COMPOUNDS);
  const mL = test ? '375' : pick(['125', '275', '375', '450', '625']);
  const M = test ? '0.750' : pick(['0.150', '0.250', '0.500', '0.750', '1.20']);
  const v = +mL, m = +M, L = v / 1000;
  const ans = L * m * c.mm;
  return {
    topic: 'Molarity → mass (like #1)',
    text: `What is the mass of ${c.f} needed to make a ${M} M solution if you want ${mL} mL of it? (1 mol ${c.name} = ${c.mm} g)`,
    steps: [
      mc(`What do you do with ${mL} mL first?`,
        `÷ 1000 → ${L.toFixed(3)} L`,
        [`× 1000 → ${v * 1000} L`, `÷ ${c.mm} (the molar mass)`, `Nothing, use ${mL} mL as-is`],
        `Molarity is mol per <b>liter</b>, so mL has to become L before you multiply by M.`),
      mc(`Which setup gives grams?`,
        `(${mL} ÷ 1000) L × ${M} mol/L × ${c.mm} g/mol`,
        [`${mL} mL × ${M} mol/L × ${c.mm} g/mol`,
         `(${mL} ÷ 1000) L × ${M} mol/L ÷ ${c.mm} g/mol`,
         `(${mL} ÷ 1000) L ÷ ${M} mol/L × ${c.mm} g/mol`],
        `L × (mol/L) = mol. Then mol × (g/mol) = g. If the units cancel down to grams, the setup is right.`),
      mc(`Final answer (3 sig figs)?`,
        `${sci(ans)} g`,
        [`${sci(v * m * c.mm)} g`, `${sci(L * m / c.mm)} g`, `${sci(L / m * c.mm)} g`],
        `${L.toFixed(3)} L × ${M} × ${c.mm} = ${ans.toFixed(2)} g → ${sci(ans)} g`)
    ]
  };
}

// #2: grams + volume -> molarity
function pMassToMolarity(test) {
  const c = test ? { f: 'KCl', name: 'potassium chloride', mm: 73.933 } : pick(COMPOUNDS);
  const g = test ? '2.50' : pick(['1.25', '2.50', '4.75', '8.00', '12.5']);
  const mL = test ? '750.0' : pick(['250.0', '500.0', '750.0', '125.0']);
  const G = +g, V = +mL, L = V / 1000;
  const mol = G / c.mm, ans = mol / L;
  return {
    topic: 'Mass → molarity (like #2)',
    text: `What is the molarity (mol/L) of a solution of ${c.name} if you dissolve ${g} g in ${mL} mL of water? (1 mol ${c.f} = ${c.mm} g)`,
    steps: [
      mc(`Which two numbers do you use FIRST to get moles?`,
        `${g} g ÷ ${c.mm} g/mol`,
        [`${g} g × ${c.mm} g/mol`, `${g} g ÷ ${mL} mL`, `${mL} mL ÷ ${c.mm} g/mol`],
        `grams ÷ molar mass = moles. Volume comes in at the end.`),
      mc(`Which setup gives molarity?`,
        `(${g} ÷ ${c.mm}) mol ÷ (${mL} ÷ 1000) L`,
        [`(${g} ÷ ${c.mm}) mol ÷ ${mL} mL`,
         `${g} g ÷ (${mL} ÷ 1000) L`,
         `(${g} × ${c.mm}) ÷ (${mL} ÷ 1000) L`],
        `M = mol ÷ L. You need moles on top (not grams) and liters on the bottom (not mL).`),
      mc(`Final answer (3 sig figs)?`,
        `${sci(ans)} M`,
        [`${sci(mol / V)} M`, `${sci(G / L)} M`, `${sci(G * c.mm / L)} M`],
        `${mol.toFixed(5)} mol ÷ ${L.toFixed(4)} L = ${ans.toFixed(4)} M → ${sci(ans)} M (3 sig figs because of ${g} g)`)
    ]
  };
}

// #3: grams of glucose -> atoms of one element
const ELEMS = [{ s: 'C', n: 6 }, { s: 'H', n: 12 }, { s: 'O', n: 6 }];
function pAtoms(test) {
  const el = test ? ELEMS[0] : pick(ELEMS);
  const g = test ? '5.40' : pick(['2.50', '5.40', '9.00', '12.0', '18.0']);
  const G = +g, mol = G / 180.16, ans = mol * el.n * NA;
  const wrongN = el.s === 'H' ? ['6', '1', '24'] : ['12', '1', '24'];
  return {
    topic: 'Grams → atoms of one element (like #3)',
    text: `How many atoms of ${el.s} are in ${g} g of glucose (C<sub>6</sub>H<sub>12</sub>O<sub>6</sub>)? (1 mol C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> = 180.16 g; 1 mol = ${AV} particles)`,
    steps: [
      mc(`How many ${el.s} atoms are in ONE molecule of C<sub>6</sub>H<sub>12</sub>O<sub>6</sub>?`,
        `${el.n}`, [...wrongN, '180.16'],
        `Read the subscript: C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> has 6 C, 12 H, 6 O. That's the number you multiply by.`),
      mc(`Which setup gives atoms of ${el.s}?`,
        `${g} g ÷ 180.16 g/mol × ${el.n} × ${AV}`,
        [`${g} g ÷ 180.16 g/mol × ${AV}`,
         `${g} g ÷ 180.16 g/mol × ${el.n} ÷ ${AV}`,
         `${g} g × 180.16 g/mol × ${el.n} × ${AV}`],
        `g → mol glucose (÷ molar mass) → mol ${el.s} (× ${el.n}) → atoms (× Avogadro). If you leave out the subscript, you're only counting glucose molecules.`),
      mc(`Final answer?`,
        `${sci(ans)} atoms ${el.s}`,
        [`${sci(mol * NA)} atoms ${el.s}`, `${sci(G * 180.16 * el.n * NA)} atoms ${el.s}`, `${sci(mol * el.n)} atoms ${el.s}`],
        `${mol.toFixed(5)} mol × ${el.n} × ${AV} = ${sci(ans)} atoms`)
    ]
  };
}

// #11: limiting reactant, theoretical yield, % yield
function pLimiting(test) {
  const gAl = test ? '10.0' : pick(['5.00', '8.00', '10.0', '12.0', '15.0']);
  const gAc = test ? '40.0' : pick(['20.0', '30.0', '40.0', '50.0', '60.0']);
  const A = +gAl, B = +gAc;
  const molAl = A / MM.Al, molAc = B / MM.H2SO4;
  const pAl = molAl / 2, pAc = molAc / 3;
  const limAl = pAl < pAc;
  const small = Math.min(pAl, pAc), big = Math.max(pAl, pAc);
  const theo = small * MM.P, bigTheo = big * MM.P;
  const actStr = test ? '30.0' : (theo * (0.55 + Math.random() * 0.35)).toPrecision(3);
  const act = +actStr;
  const pct = act / theo * 100;
  const limName = limAl ? 'Al' : 'H<sub>2</sub>SO<sub>4</sub>';
  return {
    topic: 'Limiting reactant + % yield (like #11)',
    text: `If you have ${gAl} g of aluminum metal and ${gAc} g of sulfuric acid, what mass of aluminum sulfate will you produce? What is the % yield if you actually produced ${actStr} g?`
      + `<div class="eq">${RXN}<br>${MMLINE}</div>`,
    steps: [
      mc(`Moles of Al = ?`,
        `${gAl} g ÷ 26.9815 g/mol`,
        [`${gAl} g × 26.9815 g/mol`, `${gAl} g ÷ 341.818 g/mol`, `${gAl} g ÷ 97.967 g/mol`],
        `Use Al's OWN molar mass. ${gAl} ÷ 26.9815 = ${n4(molAl)} mol Al.`),
      mc(`Which mole ratio turns mol Al → mol Al<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub>?`,
        `1 mol Al<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub> / 2 mol Al`,
        [`2 mol Al / 1 mol Al<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub>`, `3 mol / 2 mol Al`, `1 mol / 3 mol Al`],
        `Coefficients: 2 Al makes 1 Al<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub>. The thing you WANT goes on top. ${n4(molAl)} × 1/2 = ${n4(pAl)} mol product.`),
      mc(`Which mole ratio turns mol H<sub>2</sub>SO<sub>4</sub> → mol Al<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub>?`,
        `1 mol Al<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub> / 3 mol H<sub>2</sub>SO<sub>4</sub>`,
        [`3 mol H<sub>2</sub>SO<sub>4</sub> / 1 mol Al<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub>`, `1 mol / 2 mol H<sub>2</sub>SO<sub>4</sub>`, `2 mol / 3 mol H<sub>2</sub>SO<sub>4</sub>`],
        `3 H<sub>2</sub>SO<sub>4</sub> makes 1 Al<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub>. ${gAc} ÷ 97.967 = ${n4(molAc)} mol → × 1/3 = ${n4(pAc)} mol product.`),
      mc(`Which one is the limiting reactant?`,
        limName,
        ['Al', 'H<sub>2</sub>SO<sub>4</sub>', 'Al<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub>', 'H<sub>2</sub>'],
        `Al → ${n4(pAl)} mol product. H<sub>2</sub>SO<sub>4</sub> → ${n4(pAc)} mol product. The one that makes <b>LESS</b> runs out first, so ${limName} is limiting. (Don't just compare the grams!)`),
      mc(`Which setup gives the theoretical yield?`,
        `${n4(small)} mol × 341.818 g/mol`,
        [`${n4(big)} mol × 341.818 g/mol`, `${n4(small)} mol × 97.967 g/mol`, `${n4(small)} mol ÷ 341.818 g/mol`],
        `Use the SMALLER amount of product (the one from the limiting reactant), times the molar mass of the PRODUCT.`),
      mc(`Theoretical yield (sci. notation, 3 sig figs)?`,
        `${sci(theo)} g`,
        [`${sci(bigTheo)} g`, `${sci((limAl ? molAl : molAc) * MM.P)} g`, `${sci(A + B)} g`],
        `${n4(small)} × 341.818 = ${theo.toFixed(2)} g → ${sci(theo)} g`),
      mc(`Which setup gives % yield?`,
        `${actStr} g ÷ ${theo.toFixed(2)} g × 100`,
        [`${theo.toFixed(2)} g ÷ ${actStr} g × 100`, `${actStr} g ÷ ${bigTheo.toFixed(2)} g × 100`, `${actStr} g ÷ 341.818 × 100`],
        `% yield = <b>actual ÷ theoretical</b> × 100. Actual is the number they GIVE you (${actStr} g). Theoretical is the one you CALCULATED.`),
      mc(`% yield (3 sig figs)?`,
        `${pct.toPrecision(3)}% (= ${sci(pct)} %)`,
        [`${(theo / act * 100).toPrecision(3)}% (= ${sci(theo / act * 100)} %)`,
         `${(act / bigTheo * 100).toPrecision(3)}% (= ${sci(act / bigTheo * 100)} %)`,
         `${(act / MM.P * 100).toPrecision(3)}% (= ${sci(act / MM.P * 100)} %)`],
        `${actStr} ÷ ${theo.toFixed(2)} × 100 = ${pct.toFixed(2)}% → ${pct.toPrecision(3)}%. Quick check: % yield should be under 100%.`)
    ]
  };
}

// #12: grams Al -> molecules H2
function pMolecules(test) {
  const g = test ? '12.5' : pick(['5.00', '8.50', '12.5', '15.0', '20.0']);
  const G = +g, molAl = G / MM.Al, molH2 = molAl * 1.5, ans = molH2 * NA;
  return {
    topic: 'Grams → molecules of product (like #12)',
    text: `If you had ${g} g of aluminum metal and plenty of sulfuric acid, how many molecules of hydrogen gas could you produce?<div class="eq">${RXN}<br>${MMLINE}</div>`,
    steps: [
      mc(`"Plenty of sulfuric acid" means…`,
        `Al is the limiting reactant, so you only need the Al numbers`,
        [`H<sub>2</sub>SO<sub>4</sub> is the limiting reactant`, `You need to find grams of H<sub>2</sub>SO<sub>4</sub> first`, `You need to do a % yield`],
        `"Plenty" or "excess" = that reactant never runs out. Start from ${g} g Al.`),
      mc(`Which mole ratio turns mol Al → mol H<sub>2</sub>?`,
        `3 mol H<sub>2</sub> / 2 mol Al`,
        [`2 mol Al / 3 mol H<sub>2</sub>`, `3 mol H<sub>2</sub> / 1 mol Al`, `1 mol H<sub>2</sub> / 2 mol Al`],
        `Coefficients: 2 Al → 3 H<sub>2</sub>. Put what you WANT (H<sub>2</sub>) on top.`),
      mc(`Which setup gives molecules of H<sub>2</sub>?`,
        `${g} g ÷ 26.9815 g/mol × (3/2) × ${AV}`,
        [`${g} g ÷ 26.9815 g/mol × (2/3) × ${AV}`,
         `${g} g ÷ 26.9815 g/mol × (3/2) × 2.016 g/mol`,
         `${g} g ÷ 26.9815 g/mol × ${AV}`],
        `g Al → mol Al → mol H<sub>2</sub> (× 3/2) → molecules (× Avogadro). Multiplying by 2.016 would give GRAMS of H<sub>2</sub>, not molecules.`),
      mc(`Final answer?`,
        `${sci(ans)} molecules H<sub>2</sub>`,
        [`${sci(molAl * 2 / 3 * NA)} molecules H<sub>2</sub>`, `${sci(molAl * NA)} molecules H<sub>2</sub>`, `${sci(molH2 * MM.H2)} molecules H<sub>2</sub>`],
        `${n4(molAl)} mol Al × 3/2 = ${n4(molH2)} mol H<sub>2</sub> × ${AV} = ${sci(ans)} molecules`)
    ]
  };
}

const T = {
  molmass:  { name: 'Molarity → mass (#1)', fn: pMolarityToMass },
  massmol:  { name: 'Mass → molarity (#2)', fn: pMassToMolarity },
  atoms:    { name: 'Grams → atoms (#3)', fn: pAtoms },
  limiting: { name: 'Limiting reactant / % yield (#11)', fn: pLimiting },
  molec:    { name: 'Grams → molecules (#12)', fn: pMolecules }
};

// ---------- quiz engine ----------
const state = { test: true, topic: 'all', idx: 0, prob: null, step: 0, right: 0, total: 0 };
const quiz = document.getElementById('quiz');

function newProblem() {
  const keys = state.topic === 'all' ? Object.keys(T) : [state.topic];
  const key = state.test ? keys[state.idx % keys.length] : pick(keys);
  state.idx++;
  state.prob = T[key].fn(state.test);
  state.step = 0;
  renderQuiz();
}

function renderQuiz() {
  const p = state.prob, s = p.steps[state.step];
  quiz.innerHTML = `
    <div class="card"><div class="topic">${p.topic}</div><div class="problem">${p.text}</div></div>
    <div class="card">
      <div class="step">Step ${state.step + 1} of ${p.steps.length}</div>
      <div class="question">${s.q}</div>
      <div class="options">${s.options.map((o, i) => `<button data-i="${i}">${o.t}</button>`).join('')}</div>
      <div class="why" id="why"></div>
      <button class="next" id="next">Next →</button>
    </div>`;
  quiz.querySelectorAll('.options button').forEach(b => b.onclick = () => answer(+b.dataset.i));
}

function answer(i) {
  const s = state.prob.steps[state.step];
  const btns = [...quiz.querySelectorAll('.options button')];
  btns.forEach((b, j) => { b.disabled = true; if (s.options[j].ok) b.classList.add('correct'); });
  const ok = s.options[i].ok;
  if (!ok) btns[i].classList.add('wrong');
  state.total++; if (ok) state.right++;
  updateScore();
  const why = document.getElementById('why');
  why.innerHTML = (ok ? '✅ <b>Correct.</b> ' : '❌ <b>Not quite.</b> ') + s.why;
  why.style.display = 'block';
  const last = state.step === state.prob.steps.length - 1;
  const nx = document.getElementById('next');
  nx.textContent = last ? 'Next problem →' : 'Next step →';
  nx.style.display = 'inline-block';
  nx.onclick = () => { if (last) newProblem(); else { state.step++; renderQuiz(); } };
}

function updateScore() {
  const pct = state.total ? Math.round(state.right / state.total * 100) : 0;
  document.getElementById('score').textContent = `Score: ${state.right} / ${state.total} (${pct}%)`;
}

// ---------- flashcards ----------
const CARDS = [
  { f: 'Given: mL + molarity (M)<br>Want: grams', b: 'mL ÷ 1000 = L<br>L × M = mol<br>mol × molar mass = g' },
  { f: 'Given: grams + mL<br>Want: molarity', b: 'g ÷ molar mass = mol<br>mL ÷ 1000 = L<br>M = mol ÷ L' },
  { f: 'Given: grams of a compound<br>Want: atoms of ONE element', b: 'g ÷ molar mass = mol compound<br>× subscript = mol of that element<br>× 6.022×10<sup>23</sup> = atoms' },
  { f: 'Given: grams of BOTH reactants<br>Want: grams of product', b: 'It\'s a LIMITING REACTANT problem.<br>Turn each one into mol of product.<br>The smaller one is the limiting reactant and gives you the theoretical yield.' },
  { f: 'Given: grams of one reactant + "plenty/excess" of the other', b: 'Ignore the excess one. Start from the given reactant only.' },
  { f: 'Where does the mole ratio come from?', b: 'The coefficients in the BALANCED equation.<br>Put what you WANT on top.' },
  { f: '2 Al + 3 H<sub>2</sub>SO<sub>4</sub> → Al<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub> + 3 H<sub>2</sub><br><br>mol Al → mol Al<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub>', b: '× 1/2' },
  { f: '2 Al + 3 H<sub>2</sub>SO<sub>4</sub> → Al<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub> + 3 H<sub>2</sub><br><br>mol H<sub>2</sub>SO<sub>4</sub> → mol Al<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub>', b: '× 1/3' },
  { f: '2 Al + 3 H<sub>2</sub>SO<sub>4</sub> → Al<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub> + 3 H<sub>2</sub><br><br>mol Al → mol H<sub>2</sub>', b: '× 3/2' },
  { f: '% yield formula', b: 'actual ÷ theoretical × 100<br><br>Actual = the number they GIVE you<br>Theoretical = the number you CALCULATED' },
  { f: 'Want molecules / atoms / particles?', b: 'Get moles first, then × 6.022×10<sup>23</sup>' },
  { f: 'Want grams?', b: 'Get moles first, then × molar mass (of the thing you want)' },
  { f: 'Which numbers set the sig figs?', b: 'The measured numbers they give you (10.0 g, 40.0 g, 375 mL…).<br>Coefficients and subscripts don\'t count.' },
  { f: 'Write 46.5 g in scientific notation', b: '4.65 × 10<sup>1</sup> g' },
  { f: 'Oxidation # of Mn in KMnO<sub>4</sub>', b: '+7<br>(K = +1, O = −2 × 4 = −8 → Mn = +7)' },
  { f: 'Oxidation # of Cl in HClO<sub>2</sub>', b: '+3<br>(H = +1, O = −2 × 2 = −4 → Cl = +3)' },
  { f: 'Net ionic: Ni(NO<sub>3</sub>)<sub>2</sub> + NaOH', b: 'Ni<sup>2+</sup>(aq) + 2 OH<sup>−</sup>(aq) → Ni(OH)<sub>2</sub>(s)' },
  { f: 'Net ionic: SrBr<sub>2</sub> + Na<sub>2</sub>SO<sub>4</sub>', b: 'Sr<sup>2+</sup>(aq) + SO<sub>4</sub><sup>2−</sup>(aq) → SrSO<sub>4</sub>(s)' }
];
const fc = { order: CARDS.map((_, i) => i), i: 0, back: false };
const flash = document.getElementById('flash');

function renderFlash() {
  const c = CARDS[fc.order[fc.i]];
  flash.innerHTML = `
    <div class="card flash ${fc.back ? 'back' : ''}" id="fcard">
      <div class="side">${fc.back ? 'Answer' : 'Question'} · tap to flip</div>
      <div>${fc.back ? c.b : c.f}</div>
    </div>
    <div class="row">
      <button id="prev">← Prev</button>
      <span class="score">${fc.i + 1} / ${CARDS.length}</span>
      <button id="shuf">Shuffle</button>
      <button id="nextc">Next →</button>
    </div>`;
  document.getElementById('fcard').onclick = () => { fc.back = !fc.back; renderFlash(); };
  document.getElementById('prev').onclick = () => { fc.i = (fc.i - 1 + CARDS.length) % CARDS.length; fc.back = false; renderFlash(); };
  document.getElementById('nextc').onclick = () => { fc.i = (fc.i + 1) % CARDS.length; fc.back = false; renderFlash(); };
  document.getElementById('shuf').onclick = () => { fc.order = shuffle(fc.order); fc.i = 0; fc.back = false; renderFlash(); };
}

// ---------- controls ----------
const sel = document.getElementById('topicSel');
sel.innerHTML = `<option value="all">All problem types</option>` +
  Object.entries(T).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join('');
sel.onchange = () => { state.topic = sel.value; state.idx = 0; newProblem(); };

function setNums(test) {
  state.test = test; state.idx = 0;
  document.getElementById('numTest').classList.toggle('active', test);
  document.getElementById('numRand').classList.toggle('active', !test);
  newProblem();
}
document.getElementById('numTest').onclick = () => setNums(true);
document.getElementById('numRand').onclick = () => setNums(false);

function setMode(q) {
  document.getElementById('modeQuiz').classList.toggle('active', q);
  document.getElementById('modeFlash').classList.toggle('active', !q);
  document.getElementById('quizControls').classList.toggle('hidden', !q);
  quiz.classList.toggle('hidden', !q);
  flash.classList.toggle('hidden', q);
  if (!q) renderFlash();
}
document.getElementById('modeQuiz').onclick = () => setMode(true);
document.getElementById('modeFlash').onclick = () => setMode(false);

newProblem();
</script>
</body>
</html>
